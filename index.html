
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surebet Scanner Live</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#eaf0fa;font-family:-apple-system,Arial,sans-serif}
main{max-width:850px;margin:auto;padding:20px 14px 60px}
h1{font-size:27px}
h2{font-size:19px}
p,small{color:#a9b8d0;line-height:1.5}
.panel{background:#152238;border:1px solid #30435d;border-radius:16px;padding:16px;margin:15px 0}
input,select,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #40516a;background:#0c1829;color:white;font-size:16px}
button{background:#3677ed;border:0;font-weight:bold}
label{display:block;margin-top:10px;color:#b7c8de}
.green{color:#65e6a5}
.red{color:#ff8e91}
.tag{background:#273b5b;padding:5px 9px;border-radius:15px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 5px;text-align:left;border-bottom:1px solid #30435d}
.scroll{overflow-x:auto}
.notice{background:#332c1c;color:#ffe2a2;padding:12px;border-radius:10px;font-size:13px}
.stat{background:#0c1829;padding:12px;border-radius:10px;margin:10px 0}
.stat strong{font-size:23px}
</style>
</head>
<body>
<main>
<span class="tag">SCANNER AUTOMATICO</span>
<h1>🔎 Surebet Scanner</h1>
<p>Arbitraggi rilevati dall'ultima scansione disponibile.</p>
<div class="notice">
⚠️ Quote non garantite in tempo reale. Verifica bookmaker, commissioni, disponibilità e regole dei mercati prima di qualsiasi puntata.
</div>

<section class="panel">
<h2>Opportunità rilevate</h2>
<label>Mercato</label>
<select id="market">
<option value="all">Tutti</option>
<option value="1X2">1X2</option>
<option value="GG/NG">Goal / No Goal</option>
<option value="OU">Over / Under</option>
</select>
<label>Budget totale (€)</label>
<input id="budget" type="number" value="200" min="1">
<label>Profitto teorico minimo (%)</label>
<input id="minimum" type="number" value="1" min="0" step="0.1">
<button id="refresh">Aggiorna risultati</button>
<p id="status">Caricamento...</p>
<div id="results"></div>
</section>

<section class="panel">
<h2>Calcolatore manuale</h2>
<label>Mercato</label>
<select id="manualMarket">
<option value="2">Goal / No Goal</option>
<option value="ou">Over / Under 2.5</option>
<option value="3">1X2</option>
</select>
<div id="manualFields"></div>
<button id="calculate">Calcola</button>
<div id="manualResult"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const euro=n=>new Intl.NumberFormat('it-IT',{
style:'currency',currency:'EUR'
}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
let data=[];

function evaluate(outcomes,budget){
if(!Number.isFinite(budget)||budget<=0||
outcomes.length<2||
outcomes.some(o=>!Number.isFinite(o[2])||o[2]<=1))
return null;
const sum=outcomes.reduce((a,o)=>a+1/o[2],0);
const payout=budget/sum;
return {
sum,payout,profit:payout-budget,
percent:(1/sum-1)*100,
stakes:outcomes.map(o=>budget/o[2]/sum)
};
}

function normalize(item){
const outcomes=Object.entries(item.outcomes||{})
.map(([name,v])=>[
name,String(v.bookmaker||''),
Number(v.price)
]);
return {
event:item.match||'Partita',
market:item.market||'',
outcomes
};
}

function render(item,budget){
const r=evaluate(item.outcomes,budget);
if(!r)return '';
return `<div class="panel">
<h2>${esc(item.event)}</h2>
<span class="tag">${esc(item.market)}</span>
<div class="stat">
<small>Profitto teorico</small><br>
<strong class="${r.profit>0?'green':'red'}">
${euro(r.profit)} (${r.percent.toFixed(2)}%)
</strong>
</div>
<div class="scroll"><table>
<thead><tr>
<th>Esito</th><th>Bookmaker</th>
<th>Quota</th><th>Puntata</th>
</tr></thead><tbody>
${item.outcomes.map((o,i)=>`<tr>
<td>${esc(o[0])}</td>
<td>${esc(o[1])}</td>
<td>${o[2].toFixed(2)}</td>
<td>${euro(r.stakes[i])}</td>
</tr>`).join('')}
</tbody></table></div>
<p>Ritorno teorico: ${euro(r.payout)}</p>
<small>Prima di commissioni, limiti e arrotondamenti.</small>
</div>`;
}

function draw(){
const budget=Number($('budget').value);
const min=Number($('minimum').value);
const market=$('market').value;
const filtered=data.map(normalize).filter(x=>{
const r=evaluate(x.outcomes,budget);
const m=x.market.toUpperCase();
const match=market==='all'||m===market||
(market==='OU'&&(m.includes('OVER')||
m.includes('UNDER')||m.startsWith('OU')));
return r&&r.percent>=min&&match;
}).sort((a,b)=>
evaluate(b.outcomes,budget).percent-
evaluate(a.outcomes,budget).percent);
$('results').innerHTML=filtered.length?
filtered.map(x=>render(x,budget)).join(''):
'<p>Nessun arbitraggio corrisponde ai filtri.</p>';
}

async function load(){
$('status').textContent='Aggiornamento in corso...';
try{
const response=await fetch('./surebets.json?t='+Date.now(),{
cache:'no-store'
});
if(!response.ok)throw Error('HTTP '+response.status);
const json=await response.json();
if(!Array.isArray(json.surebets))
throw Error('Formato dati non valido');
data=json.surebets;
const date=json.updated_at?
new Date(json.updated_at):null;
$('status').textContent=
'Ultima scansione: '+
(date&&!isNaN(date)?
date.toLocaleString('it-IT'):'non disponibile')+
' · Opportunità nel file: '+data.length;
draw();
}catch(e){
$('status').textContent='Errore caricamento: '+e.message;
$('results').innerHTML=
'<p class="red">Controlla che surebets.json sia pubblicato nella cartella principale del repository.</p>';
}
}

function fields(){
const m=$('manualMarket').value;
const names=m==='3'?['1','X','2']:
m==='ou'?['Over 2.5','Under 2.5']:
['Goal','No Goal'];
$('manualFields').innerHTML=names.map((n,i)=>`
<label>${n} — Bookmaker</label>
<input id="bk${i}" value="Bookmaker ${i+1}">
<label>${n} — Quota</label>
<input id="od${i}" type="number" step="0.01"
min="1.01" placeholder="2.10">`).join('');
$('manualResult').innerHTML='';
}

function calculate(){
const m=$('manualMarket').value;
const names=m==='3'?['1','X','2']:
m==='ou'?['Over 2.5','Under 2.5']:
['Goal','No Goal'];
const outcomes=names.map((n,i)=>[
n,$('bk'+i).value,Number($('od'+i).value)
]);
const item={event:'Confronto manuale',
market:m==='3'?'1X2':m==='ou'?'OU2.5':'GG/NG',
outcomes};
$('manualResult').innerHTML=
render(item,Number($('budget').value))||
'<p class="red">Inserisci quote valide e budget positivo.</p>';
}

$('refresh').addEventListener('click',load);
$('market').addEventListener('change',draw);
$('budget').addEventListener('input',draw);
$('minimum').addEventListener('input',draw);
$('manualMarket').addEventListener('change',fields);
$('calculate').addEventListener('click',calculate);
fields();
load();
setInterval(load,60000);
</script>
</body>
</html>
